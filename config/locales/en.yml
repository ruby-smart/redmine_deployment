  text_deployment_respect_start_date: "The deployment pipeline of an issue and its tab \"Deployment\" count only the commits made on or after its start date (from midnight in the time zone of the user) - older commits referencing the issue are ignored. Issues without a start date count all commits."
  label_deployment_issue_indicator: Show the indicator
  text_deployment_issue_indicator: "Show the indicator on the issue page"
  text_deployment_environments_custom: "The project defines its own deployment pipeline. Unchecked: the central deployment pipeline (Administration » Plugins » RubySmart Deployment plugin)."
  text_deployment_environments_html: |-
    <b>Code</b>: reached as soon as a revision is linked to the issue.
    <b>Branch</b>: reached, if the commits are merged into the branch, e.g. <code>develop</code>.
    <b>Tag</b>: reached, if the commits are part of a tag, e.g. <code>v2.1.0</code> or <code>/^v\d+\./</code>.
    <b>Deployment</b>: reached by a successful deployment of the environment, e.g. <code>production</code>.

    <code>*</code> matches any characters, e.g. <code>feature/*</code>.
    Regular expression in slashes, not anchored, e.g. <code>/^(develop|main)$/</code> - <code>/…/i</code> is case-insensitive.

    Placeholders <code>{%object.attribute%}</code> insert a field of the issue (objects: issue, tracker, project, status, priority, category, version, author, assigned_to), e.g. <code>feature/{%issue.id%}-*</code> or <code>/^review-{%tracker.name%}$/i</code>.
  text_deployment_environments_invalid: "Invalid entries in row %{lines}: the value is required, the label and a value other than a regular expression must not contain '|', a regular expression (/.../) must be valid."
  text_deployment_environments_empty: No steps after 'Code' - the deploy status is hidden.
